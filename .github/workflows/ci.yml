name: CI

on:
push:
branches:
- main
- develop

pull_request:
branches:
- main

jobs:
backend:
name: Backend
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: ./backend

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: ./backend/package-lock.json

  - name: Install Dependencies
    run: npm ci

  - name: Generate Prisma Client
    run: npx prisma generate

  - name: Type Check
    run: npx tsc --noEmit

  - name: Run Tests
    run: npx vitest run --reporter=verbose 2>/dev/null || echo "No tests configured yet"

  - name: Build Backend
    run: npm run build
```

frontend:
name: Frontend
runs-on: ubuntu-latest

