# F6 (T5.1) — o nginx que serve o painel construído pelo Dockerfile.web.
#
# três decisões moram aqui, e nenhuma delas é cosmética:
#
# 1. O painel fala /api com a MESMA origem. Foi assim no Vite (proxy) e continua assim
#    atrás do nginx: o navegador não atravessa uma segunda origem, então não há preflight,
#    e o cookie/Authorization da sessão não precisa de CORS para existir. O CORS_ORIGIN da
#    API continua sendo a régua de quem chama de fora, não o caminho do painel.
# 2. Fallback de SPA em `try_files ... /index.html`. As rotas do painel (/app/clientes,
#    /app/cobrancas) vivem no react-router; um F5 nelas sem fallback devolve 404 do disco.
# 3. client_max_body_size amarrado ao BODY_LIMIT_BYTES da API (1 MiB). Se o nginx deixar
#    passar 20 MB e a API recusar em 1 MB, o cliente recebe a recusa mais tarde e pior
#    explicada. O valor é fixo neste arquivo: BODY_LIMIT_BYTES muda no .env, e quem mudar
#    precisa mudar esta linha junto — não existe template de nginx aqui, e preferimos a
#    limitação escrita à ilusão de que ela é automática.
#
# O X-Forwarded-For é escrito aqui e só vale porque o compose liga TRUST_PROXY=1 na API:
# sem proxy na frente esse cabeçalho é forjável (docs/adr da Fase 2), e a régua de produção
# recusa a combinação.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # Cabeçalhos que a API já coloca nas respostas dela (helmet) e que um arquivo estático
  # não colocaria sozinho.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # O index nunca fica em cache: é ele que aponta os hashes dos pedaços do build, e um index
  # velho em cache aponta para arquivos que o deploy novo apagou.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Arquivos com hash no nome (assets/index-<hash>.js) são imutáveis por construção.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
